<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>용산고등학교 데이터 플로깅 기록지</title>
    <!-- Firebase SDK (Compat 버전) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <!-- Leaflet CSS (무료 지도 라이브러리) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* 시스템 기본 스타일 선언 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: #f1f3f5;
            color: #212529;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .page {
            display: none;
            width: 100%;
            max-width: 1100px;
        }

        .page.active {
            display: block;
        }

        /* [1] 메인 화면(Intro) 스타일 */
        .intro-container {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid #e9ecef;
        }

        .intro-sub {
            font-size: 14px;
            color: #868e96;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .intro-title {
            color: #1b5e20;
            font-size: 32px;
            font-weight: 800;
            line-height: 1.4;
            margin-bottom: 20px;
            word-break: keep-all;
        }

        .intro-desc {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .start-btn {
            display: inline-block;
            padding: 15px 40px;
            background-color: #2b8a3e;
            color: #ffffff;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(43, 138, 62, 0.3);
            transition: all 0.2s ease;
        }

        .start-btn:hover {
            background-color: #1b5e20;
            transform: translateY(-2px);
        }

        /* [2] 학번/이름 입력 모달 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: #343a40;
            margin-bottom: 20px;
            border-bottom: 2px solid #2b8a3e;
            padding-bottom: 8px;
        }

        /* [3] 대시보드 화면 스타일 */
        .main-grid {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 20px;
        }

        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid #e9ecef;
        }

        .full-width {
            grid-column: span 2;
        }

        .system-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e9ecef;
            padding-bottom: 20px;
        }

        .system-header h1 {
            color: #1b5e20;
            font-size: 30px;
            font-weight: 800;
        }

        .user-badge {
            font-size: 14px;
            font-weight: 600;
            color: #495057;
            background: #e8f5e9;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #c8e6c9;
            margin-right: 10px;
        }

        .logout-btn {
            background: #fff5f5;
            border: 1px solid #ffa8a8;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            color: #c92a2a;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: #ffe3e3;
        }

        .header-stats-container {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            background: #f8f9fa;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            align-items: center;
        }

        .header-stats-title {
            font-size: 13px;
            font-weight: 600;
            color: #495057;
            border-right: 2px solid #dee2e6;
            padding-right: 15px;
        }

        .header-stat-box p {
            font-size: 18px;
            font-weight: bold;
            color: #2b8a3e;
        }

        .form-title, .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #343a40;
            border-left: 4px solid #2b8a3e;
            padding-left: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #495057;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2b8a3e;
        }

        .trash-select-container {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ced4da;
            max-height: 230px;
            overflow-y: auto;
        }

        .trash-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed #e9ecef;
        }

        .trash-row:last-child {
            border-bottom: none;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #495057;
            cursor: pointer;
        }

        .checkbox-label input[type="checkbox"] {
            width: auto !important;
        }

        .counter-input {
            width: 70px !important;
            padding: 5px !important;
            text-align: center;
            font-size: 13px;
            border-radius: 4px !important;
            border: 1px solid #ced4da;
        }

        .conditional-field {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background: #eef2f7;
            border-radius: 4px;
            border: 1px solid #d0daf0;
        }

        .conditional-field.active {
            display: block;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #2b8a3e;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .map-wrapper {
            width: 100%;
            height: 100%;
            min-height: 480px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .log-container {
            max-height: 300px;
            overflow-y: auto;
        }

        .log-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .log-info {
            font-size: 13px;
            line-height: 1.6;
            width: 85%;
        }

        .log-info .date {
            font-weight: bold;
            color: #2b8a3e;
        }

        .tag-container {
            margin-top: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .trash-tag {
            background: #e2f5e5;
            color: #1b5e20;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid #a4dba9;
        }

        .delete-btn {
            background: #fff5f5;
            color: #e03131;
            border: 1px solid #ffc9c9;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        .no-data {
            text-align: center;
            color: #868e96;
            font-size: 13px;
            padding: 30px 0;
        }

        @media (max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .system-header { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>

<div id="introPage" class="page active">
    <div class="intro-container">
        <div class="intro-sub">YONGSAN HIGH SCHOOL</div>
        <h1 class="intro-title">용산고등학교<br>데이터 플로깅 기록지</h1>
        <p class="intro-desc">
            본 시스템은 용산고등학교 학생들의 환경 정화 활동 데이터를 정량적으로 수집하고 관리하기 위한 연구용 웹 소프트웨어입니다.
        </p>
        <button class="start-btn" onclick="openModal()">기록 시작하기</button>
    </div>
</div>

<div id="authModal" class="modal-overlay">
    <div class="modal-content">
        <h2 class="modal-title">사용자 인적사항 입력</h2>
        <form id="authForm">
            <div class="form-group">
                <label for="studentId">학번 (5자리)</label>
                <input type="number" id="studentId" placeholder="예: 10101" min="10000" max="39999" required>
            </div>
            <div class="form-group">
                <label for="studentName">성명</label>
                <input type="text" id="studentName" placeholder="예: 홍길동" required>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="button" class="logout-btn" style="flex: 1; padding: 12px; text-align:center;" onclick="closeModal()">취소</button>
                <button type="submit" class="submit-btn" style="flex: 2;">확인</button>
            </div>
        </form>
    </div>
</div>

<div id="dashboardPage" class="page">
    <div class="main-grid">
        <header class="card full-width">
            <div class="system-header">
                <h1>용산고등학교 데이터 플로깅 기록 시스템</h1>
                <div>
                    <span id="userDisplay" class="user-badge">학번 성명</span>
                    <button class="logout-btn" onclick="logout()">로그아웃</button>
                </div>
            </div>
            <div class="header-stats-container">
                <div class="header-stats-title">실시간 종합 통계 현황</div>
                <div class="header-stat-box">
                    <p id="totalCount">총 활동 횟수: 0회</p>
                </div>
            </div>
        </header>

        <section class="card" style="display: flex; flex-direction: column;">
            <h2 class="section-title">활동 위치 위성 맵 인터페이스 (용산고등학교 중심)</h2>
            <div class="map-wrapper">
                <div id="map"></div>
            </div>
        </section>

        <section class="card">
            <h2 class="form-title">활동 데이터 입력</h2>
            <form id="dataForm">
                <div class="form-group">
                    <label for="date">실시 일자</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="placeInput">플로깅 장소 (정확한 주소 또는 장소명)</label>
                    <input type="text" id="placeInput" placeholder="예: 서울 용산구 두텁바위로 60 또는 후암동 주민센터" required>
                </div>

                <div class="form-group">
                    <label>수거 품목 및 수량 설정</label>
                    <div class="trash-select-container">
                        <div class="trash-row">
                            <label class="checkbox-label"><input type="checkbox" class="trash-cb" value="플라스틱 페트병"> 플라스틱 페트병</label>
                            <input type="number" class="counter-input" min="0" value="0" disabled>
                        </div>
                        <div class="trash-row">
                            <label class="checkbox-label"><input type="checkbox" class="trash-cb" value="일반 쓰레기"> 일반 쓰레기</label>
                            <input type="number" class="counter-input" min="0" value="0" disabled>
                        </div>
                        <div class="trash-row">
                            <label class="checkbox-label"><input type="checkbox" class="trash-cb" value="비닐류"> 비닐류</label>
                            <input type="number" class="counter-input" min="0" value="0" disabled>
                        </div>
                        <div class="trash-row">
                            <label class="checkbox-label"><input type="checkbox" class="trash-cb" value="알루미늄 캔"> 알루미늄 캔</label>
                            <input type="number" class="counter-input" min="0" value="0" disabled>
                        </div>
                        <div class="trash-row">
                            <label class="checkbox-label"><input type="checkbox" class="trash-cb" value="유리병류"> 유리병류</label>
                            <input type="number" class="counter-input" min="0" value="0" disabled>
                        </div>
                        <div class="trash-row">
                            <label class="checkbox-label"><input type="checkbox" class="trash-cb" value="종이 및 박스"> 종이 및 박스</label>
                            <input type="number" class="counter-input" min="0" value="0" disabled>
                        </div>
                        <div class="trash-row">
                            <label class="checkbox-label"><input type="checkbox" class="trash-cb" value="담배꽁초"> 담배꽁초</label>
                            <input type="number" class="counter-input" min="0" value="0" disabled>
                        </div>
                        <div class="trash-row">
                            <label class="checkbox-label"><input type="checkbox" id="otherTrashCb" value="기타 폐기물"> 기타 폐기물</label>
                            <input type="number" class="counter-input" min="0" value="0" disabled>
                        </div>
                        <div id="otherField" class="conditional-field">
                            <label style="font-size: 11px; color: #495057; font-weight: normal; margin-bottom: 4px;">기타 폐기물 명칭 입력</label>
                            <input type="text" id="otherTrashName" placeholder="예: 스티로폼 파편 등">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="memo">비고 (특이사항)</label>
                    <input type="text" id="memo" placeholder="예: 분리수거까지 깔끔하게 완료함">
                </div>
                <button type="submit" class="submit-btn">데이터 등록</button>
            </form>
        </section>

        <section class="card full-width">
            <h2 class="section-title">활동 기록 로그 관리</h2>
            <div id="logContainer" class="log-container">
                </div>
        </section>

    </div>
</div>

<script>
    // 파이어베이스 초기화 및 설정
    const firebaseConfig = { 
        apiKey: "AIzaSyDMsKdktTu-jtYGAz2Rr9Gyp_3pPgnv6kg", 
        authDomain: "data-plogging-site.firebaseapp.com", 
        projectId: "data-plogging-site", 
        storageBucket: "data-plogging-site.firebasestorage.app", 
        messagingSenderId: "807171750903", 
        appId: "1:807171750903:web:ab33abbad9b32af1478cf2", 
        measurementId: "G-4Q2HXP6TT7" 
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const authModal = document.getElementById('authModal');
    const authForm = document.getElementById('authForm');
    const dataForm = document.getElementById('dataForm');
    const logContainer = document.getElementById('logContainer');
    const otherTrashCb = document.getElementById('otherTrashCb');
    const otherField = document.getElementById('otherField');
    const otherTrashName = document.getElementById('otherTrashName');

    let currentUser = { id: '', name: '' };
    let appRecords = []; 
    
    // Leaflet 지도 관련 전역 제어 변수
    let map = null;
    let markersArray = []; 

    document.addEventListener('DOMContentLoaded', () => {
        setupCheckboxListeners();
        fetchRecordsFromFirebase();
    });

    // 파이어베이스에서 데이터 불러오기 함수
    function fetchRecordsFromFirebase() {
        db.collection('records').get().then((querySnapshot) => {
            appRecords = [];
            querySnapshot.forEach((doc) => {
                appRecords.push(doc.data());
            });
            renderLogs();
            updateDashboard();
        }).catch((error) => {
            console.error("데이터 로드 실패: ", error);
        });
    }

    // Leaflet 무료 위성 지도 초기화 함수
    function initLeafletMap() {
        if (map) return;
        // 용산고등학교 중심 좌표 설정 (위도: 37.5445, 경도: 126.9815)
        map = L.map('map').setView([37.5445, 126.9815], 15);

        // 무료 위성 지도 타일(Esri World Imagery) 적용
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        drawSavedMarkers();
    }

    // 무료 오픈 주소 검색 (Nominatim API 활용)
    async function searchLocation(placeQuery) {
        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(placeQuery)}`);
            const data = await response.json();
            if (data && data.length > 0) {
                return { lat: data[0].lat, lng: data[0].lon };
            }
            return null;
        } catch (error) {
            console.error("주소 검색 오류:", error);
            return null;
        }
    }

    function setupCheckboxListeners() {
        document.querySelectorAll('.trash-row').forEach(row => {
            const checkbox = row.querySelector('input[type="checkbox"]');
            const counter = row.querySelector('.counter-input');

            if(checkbox && counter) {
                checkbox.addEventListener('change', function() {
                    if(this.checked) {
                        counter.disabled = false;
                        if(counter.value === "0") counter.value = "1";
                    } else {
                        counter.disabled = true;
                        counter.value = "0";
                    }
                });
            }
        });

        otherTrashCb.addEventListener('change', function() {
            if(this.checked) {
                otherField.classList.add('active');
                otherTrashName.required = true;
            } else {
                otherField.classList.remove('active');
                otherTrashName.required = false;
                otherTrashName.value = '';
            }
        });
    }

    function openModal() { authModal.classList.add('active'); }
    function closeModal() { authModal.classList.remove('active'); authForm.reset(); }

    authForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const studentId = document.getElementById('studentId').value;
        const studentName = document.getElementById('studentName').value;

        if(studentId.length !== 5) {
            alert('올바른 학번 5자리를 입력하십시오. (예: 10101)');
            return;
        }

        currentUser.id = studentId;
        currentUser.name = studentName;
        document.getElementById('userDisplay').innerText = `${studentId} ${studentName}`;
        closeModal();
        navigateTo('dashboardPage');
        
        db.collection('records').get().then((querySnapshot) => {
            appRecords = [];
            querySnapshot.forEach((doc) => {
                appRecords.push(doc.data());
            });
            updateDashboard();
            renderLogs();

            setTimeout(() => {
                if (!map) {
                    initLeafletMap();
                } else {
                    map.invalidateSize();
                    map.setView([37.5445, 126.9815], 15);
                    drawSavedMarkers();
                }
            }, 200);
        });
    });

    function navigateTo(pageId) {
        document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
    }

    function logout() {
        if(confirm('로그아웃 하시겠습니까?')) {
            currentUser = { id: '', name: '' };
            navigateTo('introPage');
        }
    }

    dataForm.addEventListener('submit', async function(e) {
        e.preventDefault();

        const date = document.getElementById('date').value;
        const place = document.getElementById('placeInput').value;
        const memo = document.getElementById('memo').value || '특이사항 없음';
        const collectedItems = [];
        let totalCountInRecord = 0;

        document.querySelectorAll('.trash-row').forEach(row => {
            const checkbox = row.querySelector('input[type="checkbox"]');
            const counter = row.querySelector('.counter-input');

            if(checkbox && checkbox.checked) {
                let name = checkbox.value;
                const count = parseInt(counter.value, 10);

                if(count <= 0) return;

                if(checkbox === otherTrashCb && otherTrashName.value.trim() !== '') {
                    name = `기타(${otherTrashName.value.trim()})`;
                }

                collectedItems.push({ name, count });
                totalCountInRecord += count; 
            }
        });

        if(collectedItems.length === 0) {
            alert('최소 한 개 이상의 품목을 선택하고 수량을 입력해 주십시오.');
            return;
        }

        // 무료 지오코딩 API를 통한 위치 검색
        const coords = await searchLocation(place);
        if (!coords) {
            alert('입력하신 장소 또는 주소를 지도에서 찾을 수 없습니다. 정확하게 기입해 주세요.');
            return;
        }

        const record = {
            id: Date.now(),
            studentId: currentUser.id,
            studentName: currentUser.name,
            date,
            place,
            lat: parseFloat(coords.lat),
            lng: parseFloat(coords.lng),
            items: collectedItems,
            totalTrashCount: totalCountInRecord,
            memo
        };

        saveRecordToFirebase(record);
    });

    function saveRecordToFirebase(record) {
        db.collection('records').doc(String(record.id)).set(record)
            .then(() => {
                appRecords.push(record);
                updateDashboard();
                renderLogs();
                drawSavedMarkers(); 
                dataForm.reset();
                document.querySelectorAll('.counter-input').forEach(input => input.disabled = true);
                otherField.classList.remove('active');
                
                map.panTo([record.lat, record.lng]);
            })
            .catch((error) => {
                console.error("저장 실패: ", error);
                alert("데이터 저장 중 오류가 발생했습니다.");
            });
    }

    function getRecordsFromStorage() {
        return appRecords;
    }

    function updateDashboard() {
        const records = getRecordsFromStorage();
        document.getElementById('totalCount').innerText = `총 활동 횟수: ${records.length}회`;
    }

    function drawSavedMarkers() {
        markersArray.forEach(m => map.removeLayer(m));
        markersArray = [];

        const records = getRecordsFromStorage();

        records.forEach(record => {
            if(!record.lat || !record.lng) return;

            const marker = L.marker([record.lat, record.lng]).addTo(map);
            
            const popupContent = `
                <div style="font-size:12px;">
                    <strong>${record.place}</strong><br>
                    <span style="color:#2b8a3e; font-weight:bold;">수거된 쓰레기: ${record.totalTrashCount}개</span>
                </div>
            `;
            marker.bindPopup(popupContent);

            markersArray.push(marker);
        });
    }

    function renderLogs() {
        const records = getRecordsFromStorage();
        records.sort((a, b) => new Date(b.date) - new Date(a.date));

        logContainer.innerHTML = '';

        if (records.length === 0) {
            logContainer.innerHTML = '<p class="no-data">조회된 데이터가 존재하지 않습니다.</p>';
            return;
        }

        records.forEach(record => {
            const item = document.createElement('div');
            item.classList.add('log-item');
            const tagsHTML = record.items.map(it => `<span class="trash-tag">${it.name}: ${it.count}개</span>`).join('');
            item.innerHTML = `
                <div class="log-info">
                    <div class="date">[일자] ${record.date} | 장소: ${record.place} <span style="color:#666; font-weight:normal; font-size:12px;">(${record.studentId} ${record.studentName})</span></div>
                    <div class="tag-container">${tagsHTML}</div>
                    <div style="color: #666; font-size: 12px; margin-top: 6px;">비고: ${record.memo} (총 ${record.totalTrashCount}개)</div>
                </div>
                <button class="delete-btn" onclick="deleteRecord(${record.id})">삭제</button>
            `;
            logContainer.appendChild(item);
        });
    }

    function deleteRecord(id) {
        if(!confirm('정말 삭제하시겠습니까?')) return;

        db.collection('records').doc(String(id)).delete()
            .then(() => {
                appRecords = appRecords.filter(record => record.id !== id);
                updateDashboard();
                renderLogs();
                drawSavedMarkers(); 
            })
            .catch((error) => {
                console.error("삭제 실패: ", error);
                alert("데이터 삭제 중 오류가 발생했습니다.");
            });
    }
</script>

</body>
</html>
